[package]
name = "zeptocapsule"
description = "Thin sandbox library for isolated Zepto worker execution"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/qhkm/zeptocapsule"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "signal", "macros", "time", "sync", "fs", "io-util", "io-std", "net", "process"] }
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
globset = "0.4"
ipnet = "2"
httparse = "1"
# rustls + rcgen pinned to the `ring` crypto provider rather than the
# default `aws-lc-rs`. aws-lc-sys's bundled C code references glibc 2.38
# `__isoc23_*` symbols that aren't present on Ubuntu 22.04 (glibc 2.35),
# breaking CI builds. `ring` is pure-Rust assembly and links cleanly on
# any glibc version we care about.
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { version = "0.13", default-features = false, features = ["pem", "crypto", "ring"] }
webpki-roots = "1"
time = { version = "0.3", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["sched", "mount", "process", "user", "signal"] }
